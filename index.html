<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Server - Epic Adventures Await</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Animated Background -->
    <div class="background-container">
        <div class="stars"></div>
        <div class="floating-blocks">
            <div class="block block-1"></div>
            <div class="block block-2"></div>
            <div class="block block-3"></div>
            <div class="block block-4"></div>
            <div class="block block-5"></div>
        </div>
        <div class="particles"></div>
    </div>

    <!-- Revolutionary Navbar -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <div class="logo-container">
                    <img src="https://via.placeholder.com/60x60/4CAF50/FFFFFF?text=MC" alt="Minecraft Logo" class="logo-img">
                    <div class="logo-glow"></div>
                </div>
                <span class="logo-text">EPICCRAFT</span>
            </div>
            
            <div class="nav-menu">
                <div class="nav-item">
                    <a href="#home" class="nav-link">
                        <i class="fas fa-home"></i>
                        <span>Home</span>
                        <div class="nav-hover-effect"></div>
                    </a>
                </div>
                <div class="nav-item">
                    <a href="#about" class="nav-link">
                        <i class="fas fa-info-circle"></i>
                        <span>About</span>
                        <div class="nav-hover-effect"></div>
                    </a>
                </div>
                <div class="nav-item">
                    <a href="#features" class="nav-link">
                        <i class="fas fa-star"></i>
                        <span>Features</span>
                        <div class="nav-hover-effect"></div>
                    </a>
                </div>
            </div>

            <div class="nav-actions">
                <button class="action-btn store-btn">
                    <i class="fas fa-shopping-cart"></i>
                    <span>Store</span>
                    <div class="btn-glow"></div>
                </button>
                <button class="action-btn discord-btn">
                    <i class="fab fa-discord"></i>
                    <span>Discord</span>
                    <div class="btn-glow"></div>
                </button>
            </div>

            <div class="mobile-menu-toggle">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <main class="hero-section">
        <div class="hero-content">
            <div class="hero-logo-container">
                <div class="main-logo">
                    <img src="https://via.placeholder.com/150x150/4CAF50/FFFFFF?text=LOGO" alt="Main Logo" class="main-logo-img">
                    <div class="logo-rings">
                        <div class="ring ring-1"></div>
                        <div class="ring ring-2"></div>
                        <div class="ring ring-3"></div>
                    </div>
                </div>
            </div>

            <div class="hero-text">
                <h1 class="hero-title">
                    <span class="title-line">EPIC</span>
                    <span class="title-line">MINECRAFT</span>
                    <span class="title-line">ADVENTURES</span>
                </h1>
                <p class="hero-subtitle">
                    Join thousands of players in the most advanced Minecraft server experience. 
                    Build, explore, and conquer in a world where legends are born.
                </p>
            </div>

            <div class="hero-actions">
                <button class="cta-btn primary-cta">
                    <span class="btn-text">JOIN SERVER</span>
                    <div class="btn-particles"></div>
                    <div class="btn-shine"></div>
                </button>
                <button class="cta-btn secondary-cta">
                    <span class="btn-text">WATCH TRAILER</span>
                    <i class="fas fa-play"></i>
                </button>
            </div>

            <div class="server-stats">
                <div class="stat-item">
                    <div class="stat-number" data-target="1247">0</div>
                    <div class="stat-label">Players Online</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" data-target="50000">0</div>
                    <div class="stat-label">Total Players</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" data-target="99">0</div>
                    <div class="stat-label">Uptime %</div>
                </div>
            </div>
        </div>

        <!-- Scroll Indicator -->
        <div class="scroll-indicator">
            <div class="scroll-arrow">
                <i class="fas fa-chevron-down"></i>
            </div>
            <span class="scroll-text">Scroll to Explore</span>
        </div>
    </main>

    <!-- JavaScript -->
    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmileCraft - Minecraft Server</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #00ff88;
            --secondary-color: #0066ff;
            --accent-color: #ff6b35;
            --dark-bg: #0a0a0a;
            --card-bg: rgba(255, 255, 255, 0.05);
            --glass-bg: rgba(255, 255, 255, 0.1);
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --shadow-glow: 0 0 30px rgba(0, 255, 136, 0.3);
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: var(--dark-bg);
            color: var(--text-primary);
            overflow-x: hidden;
            min-height: 100vh;
            position: relative;
        }

        /* Animated Background */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(45deg, #0a0a0a, #1a1a2e, #16213e);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
        }

        .bg-animation::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="grid" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M 10 0 L 0 0 0 10" fill="none" stroke="rgba(0,255,136,0.1)" stroke-width="0.5"/></pattern></defs><rect width="100" height="100" fill="url(%23grid)"/></svg>');
            opacity: 0.3;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(10px, 10px); }
        }

        /* Floating Particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--primary-color);
            border-radius: 50%;
            opacity: 0.6;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); opacity: 0.6; }
            50% { transform: translateY(-20px) rotate(180deg); opacity: 1; }
        }

        /* Header */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px 50px;
            background: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(0, 255, 136, 0.2);
            z-index: 1000;
            transition: all 0.3s ease;
        }

        .nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 15px;
            font-family: 'Orbitron', monospace;
            font-weight: 900;
            font-size: 1.5rem;
            color: var(--primary-color);
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .logo img {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .logo:hover {
            transform: scale(1.05);
            text-shadow: 0 0 20px var(--primary-color);
        }

        .logo:hover img {
            transform: rotate(360deg);
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
        }

        .nav-buttons {
            display: flex;
            gap: 20px;
        }

        /* Main Container */
        .container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 100px 20px 50px;
            position: relative;
        }

        /* Hero Section */
        .hero {
            text-align: center;
            margin-bottom: 60px;
            animation: fadeInUp 1s ease-out;
        }

        .hero h1 {
            font-family: 'Orbitron', monospace;
            font-size: clamp(3rem, 8vw, 6rem);
            font-weight: 900;
            background: linear-gradient(45deg, var(--primary-color), var(--secondary-color), var(--accent-color));
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: textGlow 3s ease-in-out infinite, gradientShift 4s ease infinite;
            margin-bottom: 20px;
            text-shadow: 0 0 50px rgba(0, 255, 136, 0.3);
        }

        .hero p {
            font-size: 1.3rem;
            color: var(--text-secondary);
            margin-bottom: 40px;
            animation: fadeInUp 1s ease-out 0.3s both;
        }

        @keyframes textGlow {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.2); }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Server Status Card */
        .server-status {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 255, 136, 0.2);
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 40px;
            min-width: 400px;
            max-width: 600px;
            width: 100%;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            animation: fadeInUp 1s ease-out 0.6s both;
        }

        .server-status::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, var(--primary-color), var(--secondary-color), var(--accent-color));
            border-radius: 20px;
            z-index: -1;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .server-status:hover::before {
            opacity: 0.3;
        }

        .server-status:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-glow);
        }

        .server-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .info-item {
            text-align: center;
        }

        .info-label {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .info-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-color);
            font-family: 'Orbitron', monospace;
        }

        .server-ip {
            text-align: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            border: 1px solid rgba(0, 255, 136, 0.3);
            position: relative;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .server-ip:hover {
            background: rgba(0, 255, 136, 0.1);
            transform: scale(1.02);
        }

        .server-ip-label {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .server-ip-value {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--text-primary);
            font-family: 'Orbitron', monospace;
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            animation: fadeInUp 1s ease-out 0.9s both;
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn-primary {
            background: linear-gradient(45deg, var(--primary-color), #00cc6a);
            color: var(--dark-bg);
            box-shadow: 0 5px 20px rgba(0, 255, 136, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 255, 136, 0.5);
        }

        .btn-secondary {
            background: linear-gradient(45deg, var(--secondary-color), #0052cc);
            color: var(--text-primary);
            box-shadow: 0 5px 20px rgba(0, 102, 255, 0.3);
        }

        .btn-secondary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 102, 255, 0.5);
        }

        /* Loading Animation */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: var(--primary-color);
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Status Indicators */
        .status-online {
            color: var(--primary-color);
            text-shadow: 0 0 10px var(--primary-color);
        }

        .status-offline {
            color: var(--accent-color);
            text-shadow: 0 0 10px var(--accent-color);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .header {
                padding: 15px 20px;
            }

            .container {
                padding: 80px 15px 30px;
            }

            .server-status {
                min-width: auto;
                padding: 30px 20px;
            }

            .server-info {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .action-buttons {
                flex-direction: column;
                align-items: center;
            }

            .btn {
                width: 100%;
                max-width: 250px;
                justify-content: center;
            }
        }

        /* 3D Hover Effects */
        .card-3d {
            transform-style: preserve-3d;
            transition: transform 0.3s ease;
        }

        .card-3d:hover {
            transform: rotateX(5deg) rotateY(5deg);
        }

        /* Micro-interactions */
        .pulse {
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        /* Glassmorphism enhancement */
        .glass-effect {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        /* Neumorphism buttons */
        .neuro-btn {
            background: linear-gradient(145deg, #1e1e1e, #0a0a0a);
            box-shadow: 
                20px 20px 40px rgba(0, 0, 0, 0.5),
                -20px -20px 40px rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 255, 136, 0.2);
        }

        .neuro-btn:hover {
            box-shadow: 
                inset 20px 20px 40px rgba(0, 0, 0, 0.5),
                inset -20px -20px 40px rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body>
    <div class="bg-animation"></div>
    
    <!-- Floating Particles -->
    <div class="particles" id="particles"></div>

    <!-- Header -->
    <header class="header">
        <nav class="nav">
            <a href="#" class="logo">
                <img src="https://smilecraft.unaux.com/logo.png" alt="SmileCraft Logo" id="logo-img">
                <span>SmileCraft</span>
            </a>
            <div class="nav-buttons">
                <a href="#" class="btn btn-primary neuro-btn" id="store-btn">
                    <i class="fas fa-shopping-cart"></i>
                    Store
                </a>
                <a href="#" class="btn btn-secondary neuro-btn" id="discord-btn">
                    <i class="fab fa-discord"></i>
                    Discord
                </a>
            </div>
        </nav>
    </header>

    <!-- Main Container -->
    <div class="container">
        <!-- Hero Section -->
        <div class="hero">
            <h1>Welcome to SmileCraft</h1>
            <p>Experience the ultimate Minecraft adventure with cutting-edge gameplay</p>
        </div>

        <!-- Server Status Card -->
        <div class="server-status glass-effect card-3d" id="server-card">
            <div class="server-info">
                <div class="info-item">
                    <div class="info-label">Server Status</div>
                    <div class="info-value" id="server-status">
                        <div class="loading"></div>
                    </div>
                </div>
                <div class="info-item">
                    <div class="info-label">Players Online</div>
                    <div class="info-value" id="players-online">
                        <div class="loading"></div>
                    </div>
                </div>
                <div class="info-item">
                    <div class="info-label">Version</div>
                    <div class="info-value" id="server-version">
                        <div class="loading"></div>
                    </div>
                </div>
                <div class="info-item">
                    <div class="info-label">Max Players</div>
                    <div class="info-value" id="max-players">
                        <div class="loading"></div>
                    </div>
                </div>
            </div>
            
            <div class="server-ip" id="server-ip-container">
                <div class="server-ip-label">Server IP</div>
                <div class="server-ip-value">hypixel.net</div>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="action-buttons">
            <a href="#" class="btn btn-primary" id="main-store-btn">
                <i class="fas fa-store"></i>
                Visit Store
            </a>
            <a href="#" class="btn btn-secondary" id="main-discord-btn">
                <i class="fab fa-discord"></i>
                Join Discord
            </a>
        </div>
    </div>

    <script>
        // Advanced JavaScript with 2025 effects
        class MinecraftHomepage {
            constructor() {
                this.serverData = null;
                this.particles = [];
                this.init();
            }

            init() {
                this.createParticles();
                this.fetchServerStatus();
                this.setupEventListeners();
                this.startAnimationLoop();
                this.setupScrollEffects();
                this.setupMicroInteractions();
            }

            // Create floating particles
            createParticles() {
                const particlesContainer = document.getElementById('particles');
                const particleCount = 50;

                for (let i = 0; i < particleCount; i++) {
                    const particle = document.createElement('div');
                    particle.className = 'particle';
                    
                    // Random positioning
                    particle.style.left = Math.random() * 100 + '%';
                    particle.style.top = Math.random() * 100 + '%';
                    
                    // Random animation delay
                    particle.style.animationDelay = Math.random() * 6 + 's';
                    
                    // Random size variation
                    const size = Math.random() * 3 + 2;
                    particle.style.width = size + 'px';
                    particle.style.height = size + 'px';
                    
                    particlesContainer.appendChild(particle);
                    this.particles.push(particle);
                }
            }

            // Fetch server status from API
            async fetchServerStatus() {
                try {
                    const response = await fetch('https://api.mcsrvstat.us/3/hypixel.net');
                    const data = await response.json();
                    this.serverData = data;
                    this.updateServerDisplay(data);
                } catch (error) {
                    console.error('Error fetching server status:', error);
                    this.updateServerDisplay(null);
                }
            }

            // Update server display with fetched data
            updateServerDisplay(data) {
                const statusElement = document.getElementById('server-status');
                const playersElement = document.getElementById('players-online');
                const versionElement = document.getElementById('server-version');
                const maxPlayersElement = document.getElementById('max-players');

                if (data && data.online) {
                    statusElement.innerHTML = '<span class="status-online pulse">Online</span>';
                    playersElement.textContent = data.players.online.toLocaleString();
                    versionElement.textContent = data.version || 'Unknown';
                    maxPlayersElement.textContent = data.players.max.toLocaleString();
                } else {
                    statusElement.innerHTML = '<span class="status-offline pulse">Offline</span>';
                    playersElement.textContent = '0';
                    versionElement.textContent = 'Unknown';
                    maxPlayersElement.textContent = 'Unknown';
                }
            }

            // Setup event listeners
            setupEventListeners() {
                // Copy IP to clipboard
                const ipContainer = document.getElementById('server-ip-container');
                ipContainer.addEventListener('click', () => {
                    navigator.clipboard.writeText('hypixel.net').then(() => {
                        this.showNotification('Server IP copied to clipboard!');
                    });
                });

                // Button hover effects
                const buttons = document.querySelectorAll('.btn');
                buttons.forEach(btn => {
                    btn.addEventListener('mouseenter', (e) => {
                        this.createRippleEffect(e);
                    });
                });

                // Logo interaction
                const logo = document.querySelector('.logo');
                logo.addEventListener('click', (e) => {
                    e.preventDefault();
                    this.triggerLogoAnimation();
                });

                // Refresh server status every 30 seconds
                setInterval(() => {
                    this.fetchServerStatus();
                }, 30000);
            }

            // Create ripple effect on button hover
            createRippleEffect(e) {
                const button = e.currentTarget;
                const ripple = document.createElement('span');
                const rect = button.getBoundingClientRect();
                const size = Math.max(rect.width, rect.height);
                const x = e.clientX - rect.left - size / 2;
                const y = e.clientY - rect.top - size / 2;

                ripple.style.cssText = `
                    position: absolute;
                    width: ${size}px;
                    height: ${size}px;
                    left: ${x}px;
                    top: ${y}px;
                    background: rgba(255, 255, 255, 0.3);
                    border-radius: 50%;
                    transform: scale(0);
                    animation: ripple 0.6s ease-out;
                    pointer-events: none;
                `;

                button.style.position = 'relative';
                button.appendChild(ripple);

                setTimeout(() => {
                    ripple.remove();
                }, 600);
            }

            // Trigger logo animation
            triggerLogoAnimation() {
                const logoImg = document.getElementById('logo-img');
                logoImg.style.animation = 'none';
                logoImg.offsetHeight; // Trigger reflow
                logoImg.style.animation = 'spin 1s ease-in-out';
                
                setTimeout(() => {
                    logoImg.style.animation = '';
                }, 1000);
            }

            // Show notification
            showNotification(message) {
                const notification = document.createElement('div');
                notification.style.cssText = `
                    position: fixed;
                    top: 100px;
                    right: 20px;
                    background: rgba(0, 255, 136, 0.9);
                    color: #0a0a0a;
                    padding: 15px 25px;
                    border-radius: 10px;
                    font-weight: 600;
                    z-index: 10000;
                    animation: slideInRight 0.3s ease-out;
                `;
                notification.textContent = message;
                document.body.appendChild(notification);

                setTimeout(() => {
                    notification.style.animation = 'slideOutRight 0.3s ease-in';
                    setTimeout(() => {
                        notification.remove();
                    }, 300);
                }, 3000);
            }

            // Setup scroll effects
            setupScrollEffects() {
                let ticking = false;

                const updateScrollEffects = () => {
                    const scrollY = window.scrollY;
                    const header = document.querySelector('.header');
                    
                    if (scrollY > 50) {
                        header.style.background = 'rgba(10, 10, 10, 0.95)';
                        header.style.boxShadow = '0 5px 20px rgba(0, 0, 0, 0.3)';
                    } else {
                        header.style.background = 'rgba(10, 10, 10, 0.8)';
                        header.style.boxShadow = 'none';
                    }

                    ticking = false;
                };

                window.addEventListener('scroll', () => {
                    if (!ticking) {
                        requestAnimationFrame(updateScrollEffects);
                        ticking = true;
                    }
                });
            }

            // Setup micro-interactions
            setupMicroInteractions() {
                // Card tilt effect
                const serverCard = document.getElementById('server-card');
                serverCard.addEventListener('mousemove', (e) => {
                    const rect = serverCard.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    const centerX = rect.width / 2;
                    const centerY = rect.height / 2;
                    const rotateX = (y - centerY) / 10;
                    const rotateY = (centerX - x) / 10;

                    serverCard.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateZ(10px)`;
                });

                serverCard.addEventListener('mouseleave', () => {
                    serverCard.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) translateZ(0px)';
                });

                // Button magnetic effect
                const buttons = document.querySelectorAll('.btn');
                buttons.forEach(btn => {
                    btn.addEventListener('mousemove', (e) => {
                        const rect = btn.getBoundingClientRect();
                        const x = e.clientX - rect.left - rect.width / 2;
                        const y = e.clientY - rect.top - rect.height / 2;
                        
                        btn.style.transform = `translate(${x * 0.1}px, ${y * 0.1}px)`;
                    });

                    btn.addEventListener('mouseleave', () => {
                        btn.style.transform = 'translate(0px, 0px)';
                    });
                });
            }

            // Animation loop for dynamic effects
            startAnimationLoop() {
                const animate = () => {
                    // Update particle positions
                    this.particles.forEach((particle, index) => {
                        const time = Date.now() * 0.001;
                        const offset = index * 0.1;
                        const x = Math.sin(time + offset) * 2;
                        const y = Math.cos(time + offset) * 2;
                        
                        particle.style.transform = `translate(${x}px, ${y}px)`;
                    });

                    requestAnimationFrame(animate);
                };

                animate();
            }
        }

        // Add CSS animations
        const style = document.createElement('style');
        style.textContent = `
            @keyframes ripple {
                to {
                    transform: scale(2);
                    opacity: 0;
                }
            }

            @keyframes slideInRight {
                from {
                    transform: translateX(100%);
                    opacity: 0;
                }
                to {
                    transform: translateX(0);
                    opacity: 1;
                }
            }

            @keyframes slideOutRight {
                from {
                    transform: translateX(0);
                    opacity: 1;
                }
                to {
                    transform: translateX(100%);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);

        // Initialize the application
        document.addEventListener('DOMContentLoaded', () => {
            new MinecraftHomepage();
        });

        // Add some extra visual flair
        document.addEventListener('mousemove', (e) => {
            const cursor = document.querySelector('.cursor');
            if (!cursor) {
                const newCursor = document.createElement('div');
                newCursor.className = 'cursor';
                newCursor.style.cssText = `
                    position: fixed;
                    width: 20px;
                    height: 20px;
                    background: radial-gradient(circle, rgba(0,255,136,0.3) 0%, transparent 70%);
                    border-radius: 50%;
                    pointer-events: none;
                    z-index: 9999;
                    transition: transform 0.1s ease;
                `;
                document.body.appendChild(newCursor);
            }
            
            const cursorElement = document.querySelector('.cursor');
            cursorElement.style.left = e.clientX - 10 + 'px';
            cursorElement.style.top = e.clientY - 10 + 'px';
        });
    </script>
</body>
</html>
